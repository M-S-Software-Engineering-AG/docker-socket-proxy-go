name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # An older release line must not move :latest or the "Latest" release.
      - name: Resolve previous and highest tag
        id: tags
        run: |
          echo "prev=$(git describe --tags --abbrev=0 --match 'v*' HEAD^)" >> "$GITHUB_OUTPUT"
          highest=$(git tag -l 'v*' --sort=-v:refname | head -1)
          echo "latest=$([ "$highest" = "$GITHUB_REF_NAME" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # ponytail: scans the binary, not the image — distroless static carries no packages worth scanning.
      - name: Build
        run: CGO_ENABLED=0 go build -ldflags "-s -w" -o dist/proxy .
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: rootfs  # reads the Go module info embedded in the binary
          scan-ref: dist
          severity: HIGH,CRITICAL
          exit-code: '1'
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/bake-action@v7
        env:
          VERSION: ${{ github.ref_name }}
          GIT_SHA: ${{ github.sha }}
          LATEST: ${{ steps.tags.outputs.latest }}
        with:
          files: docker-bake.hcl
          push: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          PREV: ${{ steps.tags.outputs.prev }}
          LATEST: ${{ steps.tags.outputs.latest }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --notes-start-tag "$PREV" --latest="$LATEST"
